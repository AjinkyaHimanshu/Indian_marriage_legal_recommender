[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-marriage-legal-recommender"
version = "0.1.0"
description = "RAG-based Indian marriage-law legal assistant (LangChain + Anthropic Claude)"
requires-python = ">=3.10,<3.13"

dependencies = [
    # -----------------------------
    # Core
    # -----------------------------
    "pandas==2.2.2",
    "numpy<2",
    "lxml",
    "beautifulsoup4",
    "requests",
    "rapidfuzz",
    "python-dotenv",
    "pyyaml",
    "tqdm",

    # -----------------------------
    # PyTorch (Version-locked)
    # -----------------------------
    "torch==2.2.2",
    "torchvision==0.17.2",
    "torchaudio==2.2.2",

    # -----------------------------
    # Transformers & embeddings
    # -----------------------------
    "transformers==4.57.6",
    "sentence-transformers==5.3.0",
    "peft==0.11.1",
    "einops==0.8.2",

    # -----------------------------
    # Vector DB & NLP
    # -----------------------------
    "qdrant-client==1.17.1",
    "rank_bm25",
    "nltk",

    # -----------------------------
    # RAG framework: LangChain (industry standard)
    # -----------------------------
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-anthropic>=0.3,<0.4",
    "langchain-huggingface>=0.1",
    "langchain-qdrant>=0.2",

    # -----------------------------
    # UI & visualization
    # -----------------------------
    "ipywidgets",
    "matplotlib",
    "seaborn",
    "streamlit",

    # -----------------------------
    # LLM provider: Anthropic Claude only
    # -----------------------------
    "anthropic",

    # -----------------------------
    # Excel
    # -----------------------------
    "openpyxl",
]

[dependency-groups]
# Installed by default on `uv sync`; skip with `uv sync --no-dev`.
dev = [
    "jupyterlab",
    "ipykernel",
]

# Use the OS trust store so uv works behind corporate TLS-inspecting proxies
# (equivalent to passing --native-tls / --system-certs on every command).
[tool.uv]
system-certs = true

# PyTorch installs the CPU build from PyPI by default — this app does NOT require a
# GPU. To switch to a CUDA build, see the "GPU / CUDA (optional)" section in README.md.

# Tell the build system exactly where your code lives
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["indian_marriage_legal_recommender*", "config*"]
namespaces = false